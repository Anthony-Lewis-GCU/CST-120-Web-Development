<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery and Frameworks: file 3</title>

    <!-- Adding Jaquery Framework -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    
    <!-- Customized scripting -->
    <script>
        function clicked ()
        {
            alert("I was clicked");
        }

        function User(firstName, lastName, age) {
                this.firstName = firstName;
                this.lastName = lastName;
                this.age = age;
            }

        var users=[];
        users.push(
            new User("Anthony", "Lewis", 34),
            new User("Glynis", "Lewis", 56),
            new User("Stephen J.", "Lewis", 57),
            new User("Stephen P.", "Lewis", 35),
        );

        function displayUsers() {
            var x=0;
            for(var user of users)
            {
                var rowstyle = x & 1 ? "#FFFFFF" : "#F0F0F0";
                var markup = "<tr>" +
                                    "<td>" + user.firstName + "</td>" +
                                    "<td>" + user.lastName + "</td>" +  
                                    "<td>" + user.age + "</td>" +
                             "</tr>";
                
                $("#users").find("tbody").append(markup);
                $("#users").find("tbody").find("tr").last().attr("id", x);  // User jQuery attr() to set the row id
                $("#users").find("tbody").find("tr").last().attr("align", "center");  // User jQuery attr() to set the row align
                $("#users").find("tbody").find("tr").last().css("background-color", rowstyle);  // User jQuery css() to set the row color
                $("#users").find("tbody").find("tr").last().find("td").get(0).id = x + "_0";  // User jQuery to set the unique column 1 id
                $("#users").find("tbody").find("tr").last().find("td").get(1).id = x + "_1";  // User jQuery to set the unique column 2 id
                $("#users").find("tbody").find("tr").last().find("td").get(2).id = x + "_2";  // User jQuery to set the unique column 3 id
                
                x++;  // Next row
            }

            $("#0_1").bind('click', clicked);  // User jQuery bind() to set the click handler
        }

        $(document).ready(displayUsers);
    </script>
</head>
<body>
    <h1 style="text-align: center;">JQuery and Frameworks: Playjql3.html</h1>
    <table id="users" width="50%" border="1">
        <thead>
            <tr style="background-color: #A0A0A0;">
                <th width="33%">First Name</th>
                <th width="33%">Last Name</th>
                <th width="33%">Age</th>
            </tr>
        </thead>
        <tbody>
        </tbody>
    </table>
</body>
</html>
