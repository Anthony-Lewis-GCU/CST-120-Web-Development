<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JQuery and Frameworks: file 2</title>

    <!-- Adding Jaquery Framework -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    
    <!-- Customized scripting -->
    <script>
        var User = 
        {
            firstName: "Anthony",
            lastName: "Lewis",
            age: 34
        };

        function displayUser() {
            $("#fn").html(User.firstName);
            $("#users").find("#ln").text(User.lastName);
            $("#users").find("#age").text(User.age);
        }

        $(document).ready(displayUser);
    </script>
</head>
<body>
    <h1 style="text-align: center;">JQuery and Frameworks: Playjql2.html</h1>
    <table id="users" width="50%" border="1">
        <thead>
            <tr>
                <th width="33%">First Name</th>
                <th width="33%">Last Name</th>
                <th width="33%">Age</th>
            </tr>
        </thead>
        <tbody>
            <tr align="center">
                <td id="fn">?</td>
                <td id="ln">?</td>
                <td id="age">?</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
