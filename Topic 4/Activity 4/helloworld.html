<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity 4</title>

    <script>
        /**
         * Hello world JavaScript that displays an alert window
         * display HTML in a div tag
         * and logs a message to the debug console
         **/
        function sayHello()
        {
            // use a single line comment for code statements
        alert('Hello world!');
        document.getElementById('hello-text').innerHTML = "Hello world!";
        console.log2("Hello world!");
        }
     </script>
</head>
<body onload="sayHello()">
    <!-- Display text before we start running JavaScript -->
     <p>Before Running Javascript</p>

    <!-- A div tag so we display some text using javascript -->
    <div id="hello-text">
        This is the default text.
    </div>

    <!-- Hello World JavaScript script that displays an alert window, display HTML in a div tag -->
     

     <!-- Display text after we are done running JavaScript-->
    <p>After running JavaScript</p>
</body>
</html>
